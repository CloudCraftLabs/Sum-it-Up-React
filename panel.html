
<div id="summarizationPanel">

                            </div>
                        </div>

                                <!-- Messages will be appended here -->

    <button class="tab-chng-btn" id="previousTab"><img id="img-icon-before" class="img-icon" src="static/images/stickers/before.png" alt=""></button>

                        </div>
                    </div>
                    <div class="indi-side-panel-nav-link">
                        <div>
                            <input id="option_audio" type="checkbox" hidden>
                            <label for="option_audio"><img id="img-icon-audio" class="img-icon" src="static/images/stickers/audio.png" alt=""></label>
                        </div>
                    </div>
                    <div class="indi-side-panel-nav-link">
                        <div>
                            <input id="option_highlighter" type="checkbox" hidden>
                            <label for="option_highlighter"><img id="img-icon-highlighter" class="img-icon" src="static/images/stickers/highlighter.png" alt=""></label>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="print-cntnt-cntnr">
        <body>
            <header>
                <div class="hs hs-1">
                    <div class="org-title">Summary Generator</div>
                </div>
            </header>
            <main>
                <div class="wrpr">
                    <section>
                        <div class="sctn-wrpr">
                            <div class="sctn-header">Summary</div>
                            <div class="sctn-cntnt">
                                <div id="summary-cntnt"></div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </body>
    </div>
</div>

<script>
function loadSummary() {
    var text_url = $(location).prop('href');
    var summary_type = $('#summary_type').val();
    var selectedLength = localStorage.getItem('summary_length') || 'short';
    var selectedStyle = localStorage.getItem('summary_style') || 'concise';

    // Show loader
    $(".loader-cntnr").show();

    $.ajax({
        url: 'https://rago6qu4uneepm7wivuf5sbu340zxnes.lambda-url.ap-south-1.on.aws/summary-via-url',
        type: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        data: JSON.stringify({
            text_url: text_url,
            summary_type: summary_type,
            length: selectedLength,
            style: selectedStyle
        }),
        success: function(response) {
            // Hide loader
            $(".loader-cntnr").hide();

            if (response['data'] != "UNABLE ACCESS") {
                console.log('Success:', response);
                $("#response_output").html(response['data']);
                convertToH3($("#response_output").get(0));
                convertToDiv($("#response_output").get(0));
                replace_astersik_to_br($("#response_output").get(0));
                $("#response_flowchart").html();
                $("#response_input_summary").html();
            } else {
                response['data'] = "We are unable to access the data due to private user site!";
                console.log('Failure:', response);
                $("#response_output").html(response['data']);
                convertToH3($("#response_output").get(0));
                convertToDiv($("#response_output").get(0));
                replace_astersik_to_br($("#response_output").get(0));
                $("#response_flowchart").html();
                $("#response_input_summary").html();
            }
        },
        error: function(xhr, status, error) {
            // Hide loader
            $(".loader-cntnr").hide();

            console.error(xhr, status, error);
            $("#response_output").html(error);
            $("#response_flowchart").html(error);
            $("#response_input_summary").html(error);
        }
    });
}
</script>
